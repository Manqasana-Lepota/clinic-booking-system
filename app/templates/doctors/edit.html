{% extends "layouts/admin_base.html" %}

{% block title %}
Edit Doctor
{% endblock %}


{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Doctor</h1>
        <p>Update doctor information</p>
    </div>

    <a href="{{ url_for('doctor.doctors') }}" 
       class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>
        Back

    </a>

</div>


<div class="table-card">

<form method="POST">


<div class="row">


<div class="col-md-6 mb-3">

<label>Full Name</label>

<input type="text"
       name="name"
       class="form-control"
       value="{{ doctor.name }}"
       required>

</div>



<div class="col-md-6 mb-3">

<label>Email</label>

<input type="email"
       name="email"
       class="form-control"
       value="{{ doctor.email }}"
       required>

</div>


</div>



<div class="row">


<div class="col-md-6 mb-3">

<label>Phone</label>

<input type="text"
       name="phone"
       class="form-control"
       value="{{ doctor.phone }}"
       required>

</div>



<div class="col-md-6 mb-3">

<label>Gender</label>

<select name="gender"
        class="form-select">


<option {% if doctor.gender=="Male" %}selected{% endif %}>
Male
</option>


<option {% if doctor.gender=="Female" %}selected{% endif %}>
Female
</option>


<option {% if doctor.gender=="Other" %}selected{% endif %}>
Other
</option>


</select>

</div>


</div>



<div class="row">


<div class="col-md-6 mb-3">

<label>Speciality</label>


<select name="speciality"
        class="form-select">


<option>General Practitioner</option>
<option>Cardiologist</option>
<option>Dentist</option>
<option>Dermatologist</option>
<option>Pediatrician</option>
<option>Neurologist</option>
<option>Psychiatrist</option>
<option>Gynecologist</option>
<option>Ophthalmologist</option>


</select>


</div>



<div class="col-md-6 mb-3">

<label>Qualification</label>

<input type="text"
       name="qualification"
       class="form-control"
       value="{{ doctor.qualification }}">

</div>


</div>



<div class="row">


<div class="col-md-6 mb-3">

<label>Experience</label>

<input type="number"
       name="experience"
       class="form-control"
       value="{{ doctor.experience }}">

</div>



<div class="col-md-6 mb-3">

<label>Status</label>


<select name="status"
        class="form-select">


<option value="Active"
{% if doctor.status=="Active" %}selected{% endif %}>
Active
</option>


<option value="Inactive"
{% if doctor.status=="Inactive" %}selected{% endif %}>
Inactive
</option>


</select>


</div>


</div>



<button class="btn btn-primary">

<i class="fa-solid fa-save"></i>

Update Doctor

</button>


</form>

</div>


{% endblock %}
