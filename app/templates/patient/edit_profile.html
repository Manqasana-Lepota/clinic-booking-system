{% extends "layouts/patient_base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Profile</h1>
        <p>Update your contact information.</p>
    </div>

</div>

<div class="form-card">

<form method="POST">

<div class="form-group">

<label>Name</label>

<input
    type="text"
    value="{{ patient.name }}"
    readonly>

</div>

<div class="form-group">

<label>Email</label>

<input
    type="email"
    value="{{ patient.email }}"
    readonly>

</div>

<div class="form-group">

<label>Phone</label>

<input
    type="text"
    name="phone"
    value="{{ patient.phone }}"
    required>

</div>

<div class="form-group">

<label>Gender</label>

<input
    type="text"
    value="{{ patient.gender }}"
    readonly>

</div>

<div class="form-group">

<label>Date of Birth</label>

<input
    type="text"
    value="{{ patient.date_of_birth }}"
    readonly>

</div>

<div class="form-group">

<label>Address</label>

<textarea
    name="address"
    rows="4"
    required>{{ patient.address }}</textarea>

</div>

<div class="form-actions">

    <a href="{{ url_for('patient_dashboard.profile') }}"
       class="btn btn-secondary">

        Cancel

    </a>

    <button
        type="submit"
        class="btn btn-primary">

        Save Changes

    </button>

</div>

</form>

</div>

{% endblock %}
