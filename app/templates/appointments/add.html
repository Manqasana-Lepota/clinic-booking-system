{% extends "layouts/admin_base.html" %}

{% block title %}Add Appointment{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Appointment</h1>
        <p>Create a new appointment.</p>
    </div>
</div>

<div class="form-card">

    <form method="POST">

        <!-- Patient -->
        <div class="form-group">
            <label>Patient</label>

            <select name="patient_id" required>

                <option value="">Select Patient</option>

                {% for patient in patients %}

                <option value="{{ patient.id }}">
                    {{ patient.name }}
                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Doctor -->
        <div class="form-group">
            <label>Doctor</label>

            <select
                name="doctor_id"
                id="doctorSelect"
                required>

                <option value="">Select Doctor</option>

                {% for doctor in doctors %}

                <option value="{{ doctor.id }}">
                    {{ doctor.name }}
                </option>

                {% endfor %}

            </select>
        </div>

        <!-- Schedule -->
        <div class="form-group">
            <label>Schedule</label>

            <select
                name="schedule_id"
                id="scheduleSelect"
                required>

                <option value="">Select Schedule</option>

            </select>
        </div>

        <!-- Appointment Date -->
        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                name="appointment_date"
                required>

        </div>

        <!-- Reason -->
        <div class="form-group">

            <label>Reason</label>

            <textarea
                name="reason"
                rows="4"
                placeholder="Enter reason for appointment"></textarea>

        </div>

        <!-- Buttons -->
        <div class="form-actions">

            <a href="{{ url_for('appointment.appointments') }}"
               class="btn btn-secondary">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Appointment

            </button>

        </div>

    </form>

</div>

<!-- JavaScript -->
<script>

const doctorSelect = document.getElementById("doctorSelect");
const scheduleSelect = document.getElementById("scheduleSelect");

doctorSelect.addEventListener("change", function () {

    let doctorId = this.value;

    scheduleSelect.innerHTML =
        '<option value="">Loading schedules...</option>';

    if (doctorId === "") {

        scheduleSelect.innerHTML =
            '<option value="">Select Schedule</option>';

        return;
    }

    fetch("/admin/get-schedules/" + doctorId)

        .then(response => response.json())

        .then(data => {

            scheduleSelect.innerHTML =
                '<option value="">Select Schedule</option>';

            if (data.length === 0) {

                scheduleSelect.innerHTML +=
                    '<option disabled>No schedules available</option>';

                return;
            }

            data.forEach(schedule => {

                scheduleSelect.innerHTML += `
                    <option value="${schedule.schedule_id}">
                        ${schedule.day} (${schedule.start_time} - ${schedule.end_time})
                    </option>
                `;

            });

        })

        .catch(error => {

            console.error(error);

            scheduleSelect.innerHTML =
                '<option value="">Error loading schedules</option>';

        });

});

</script>

{% endblock %}
