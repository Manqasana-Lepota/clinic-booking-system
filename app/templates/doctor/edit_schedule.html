{% extends "layouts/doctor_base.html" %}


{% block title %}
Edit Schedule
{% endblock %}


{% block content %}

<h1>Edit Schedule</h1>

<form method="POST">


<label>
Day
</label>

<select name="day" class="form-control">

<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>

</select>

<br>


<label>
Start Time
</label>

<input
type="time"
name="start_time"
value="{{ schedule.start_time }}"
class="form-control"
required>


<br>


<label>
End Time
</label>

<input
type="time"
name="end_time"
value="{{ schedule.end_time }}"
class="form-control"
required>


<br>

<select
name="status"
class="form-control">

<option value="Available"
{% if schedule.status=="Available" %}selected{% endif %}>
Available
</option>

<option value="Not Available"
{% if schedule.status=="Not Available" %}selected{% endif %}>
Not Available
</option>

</select>


<button class="btn btn-success">

Save Schedule

</button>


</form>


{% endblock %}
