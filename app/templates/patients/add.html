{% extends "layouts/admin_base.html" %}

{% block title %}Add Patient{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Add Patient</h1>
</div>

<div class="table-card">

<form method="POST">

<input type="text" name="name" placeholder="Full Name" class="form-control" required><br>

<input type="email" name="email" placeholder="Email" class="form-control" required><br>

<input type="password" name="password" placeholder="Password" class="form-control" required><br>

<input type="text" name="phone" placeholder="Phone" class="form-control" required><br>

<select name="gender" class="form-control" required>
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>

<br>

<label>Date of Birth</label>

<input type="date" name="date_of_birth" class="form-control" required>

<br>

<textarea
    name="address"
    class="form-control"
    placeholder="Address"
    rows="4"
    required></textarea>

<br>

 <a href="{{ url_for('patient.patients') }}"
       class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>

        Back

    </a>

<button class="btn btn-success">

    Save Patient

</button>

<a href="{{ url_for('patient.patients') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
